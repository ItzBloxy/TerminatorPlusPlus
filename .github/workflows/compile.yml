name: "Compile"

on:
  push:
  pull_request:
  # So the workflow can be started by hand from the Actions tab, not only by a push.
  workflow_dispatch:

jobs:
  gradle:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    # The GameTest step boots a Minecraft server. If one ever hangs, fail in minutes
    # rather than sitting on a runner until the six-hour default expires.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # v6 defaults to "enhanced" caching, which pulls in gradle-actions-caching -- a
          # closed-source component under Gradle Technologies' own terms of use rather than
          # the MIT licence covering the rest of the action. "basic" is the MIT-licensed
          # actions/cache implementation, and the proprietary component is then never loaded.
          # Opt-out documented in DISTRIBUTION.md in the gradle/actions repository.
          cache-provider: basic

      - name: Execute Gradle build
        run: ./gradlew build

      # The unit tests above cover pure maths; these boot a real headless server and
      # cover mining, clutching and the block rules. Placed before the upload so a
      # failure here means no jar is published.
      - name: Run the in-world GameTests
        run: ./gradlew runGameTestServer

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: TerminatorPlusPlus
          path: |
            build/libs/
