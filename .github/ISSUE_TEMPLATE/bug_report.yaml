name: Bug Report
description: Report an issue
title: "[Bug]: "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug.
      placeholder: Tell us what went wrong!
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod Version
      description: Shown in the server startup log and the mods list. The jar filename has it too.
      placeholder: 5.0.0-ALPHA
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server Version
      description: The loader and Minecraft version. This mod is server-side, so the client version rarely matters.
      placeholder: NeoForge 26.2.0.87 on Minecraft 26.2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other useful information regarding your issue.
      placeholder: This only happens if and when...
    validations:
      required: false
  - type: checkboxes
    id: conditions
    attributes:
      label: Checklist
      description: By submitting this issue, you have checked these conditions.
      options:
        - label: My issue does not match any existing issues on this repo
          required: true
