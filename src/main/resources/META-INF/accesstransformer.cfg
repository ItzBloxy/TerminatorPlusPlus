# TerminatorPlus access transformers
#
# Minecraft 26.1+ ships an unobfuscated server, so these use real names.

# Bot.doTick() re-syncs equipment to clients after the agent changes a bot's held
# item. The Paper build called detectEquipmentUpdatesPublic(), a Paper-added public
# wrapper; in vanilla the method is private, so widen it instead.
public net.minecraft.world.entity.LivingEntity detectEquipmentUpdates()V

# Bots can optionally join the real PlayerList, which upstream did with a plain
# getPlayers().add(bot). NeoForge deliberately narrowed getPlayers() to an unmodifiable view
# ("we don't want people removing things without us knowing"), so the backing list is the only
# way to reproduce that without placeNewPlayer's side effects — a join broadcast to every
# player, PlayerLoggedInEvent, a datapack and recipe sync, and a teleport. Upstream fired none
# of those. See Plan B task 9.
#
# playersByUUID needs no entry: getPlayersByUUID() already returns the live map, and we
# deliberately do not touch it — see BotFactory.spawn.
public net.minecraft.server.players.PlayerList players
