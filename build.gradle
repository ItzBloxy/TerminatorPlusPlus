plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

// In-world tests live in their own source set, not in main. NeoForge GameTests run
// inside a real server, so they need the testframework dependency at dev runtime — but
// neither the tests nor that dependency belong in a published jar. Keeping them here
// means `jar` only ever contains main.
sourceSets {
    gametest
}

neoForge {
    version = project.neo_version

    runs {
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // Binding both source sets to the same mod id puts the gametest classes inside the
    // 'tplus' mod container, which is what the testframework's annotation scan walks.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }

    addModdingDependenciesTo sourceSets.gametest

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// localRuntime lands on the dev run classpath but is not published, which is exactly
// what the testframework needs: GameTests load it in-game, consumers of the mod never do.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation "net.neoforged:testframework:${neo_version}"

    gametestImplementation sourceSets.main.output
    gametestImplementation "net.neoforged:testframework:${neo_version}"

    localRuntime "net.neoforged:testframework:${neo_version}"
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
